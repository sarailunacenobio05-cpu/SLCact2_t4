<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de empleados</title>
</head>
<body>
    <h1>Lista de empleados</h1>
    <p>Proyecto de: <span th:text="${autor}"></span></p>

    <form th:action="@{/empleados}" method="get">
        Filtrar por puesto: <input type="text" name="puesto">
        <button type="submit">Filtrar</button>
    </form>
    <br>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Puesto</th>
            <th>Edad</th>
            <th>Detalle</th>
        </tr>
        <tr th:each="e : ${empleados}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.apellido}"></td>
            <td th:text="${e.puesto}"></td>
            <td th:text="${e.edad}"></td>
            <td><a th:href="@{/empleados/{id}(id=${e.id})}">Ver</a></td>
        </tr>
    </table>
    <br>
    <a th:href="@{/empleados/nuevo}">Agregar empleado</a>
</body>
</html>
